name: tokens-qa-build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: QA
        run: npm run qa
      - name: Build
        run: npm run build