<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2ГИС ГеоПоток: Логистика</title>
    <style>
      :root {
        --color-primary: #12951A;
        --color-primary-hover: #19AA1E;
        --color-primary-pressed: #00830C;
        --color-canvas: #192025;
        --color-secondary-bg: rgba(255,255,255,0.12);
        --color-ink: #FFFFFF;
        --color-ink-secondary: rgba(255,255,255,0.64);
        --space-lg: 16px;
        --space-2xl: 24px;
        --space-3xl: 32px;
        --radius-lg: 12px;
        --container-width: 1168px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--color-canvas);
        color: var(--color-ink);
        font-family: "Suisse Intl";
      }

      button {
        font: inherit;
      }

      .hero {
        background: var(--color-canvas);
        padding: 96px 24px;
      }

      .container {
        max-width: var(--container-width);
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        column-gap: 32px;
        align-items: center;
      }

      .hero-content {
        grid-column: span 7;
        max-width: 622px;
      }

      .display-xl {
        margin: 0;
        color: var(--color-ink);
        font-size: 56px;
        line-height: 68px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .body-md {
        margin: 24px 0 0;
        color: var(--color-ink-secondary);
        font-size: 16px;
        line-height: 24px;
        font-weight: 400;
        letter-spacing: -0.01em;
      }

      .cta-group {
        display: flex;
        gap: 16px;
        margin-top: 32px;
      }

      .button-primary,
      .button-secondary {
        min-height: 48px;
        border: 0;
        border-radius: var(--radius-lg);
        padding: 12px 28px;
        color: var(--color-ink);
        font-size: 16px;
        line-height: 24px;
        font-weight: 500;
        letter-spacing: 0;
        cursor: pointer;
      }

      .button-primary {
        background: var(--color-primary);
      }

      .button-primary:hover {
        background: var(--color-primary-hover);
      }

      .button-primary:active {
        background: var(--color-primary-pressed);
      }

      .button-secondary {
        background: var(--color-secondary-bg);
      }

      .hero-visual {
        grid-column: span 5;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .hero-visual img {
        display: block;
        width: 100%;
        max-width: 584px;
        height: auto;
      }

      @media (max-width: 767px) {
        .hero {
          padding: 64px 16px;
        }

        .container {
          max-width: 343px;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          gap: 32px;
        }

        .hero-content {
          max-width: 343px;
        }

        .display-xl {
          font-size: 40px;
          line-height: 44px;
          letter-spacing: -0.02em;
        }

        .cta-group {
          flex-direction: column;
          gap: 16px;
        }

        .button-primary,
        .button-secondary {
          width: 100%;
        }

        .hero-visual {
          width: 100%;
        }

        .hero-visual img {
          width: 80%;
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero hero-split" aria-labelledby="hero-title">
        <div class="container">
          <div class="hero-content">
            <h1 class="display-xl" id="hero-title">2ГИС ГеоПоток: Логистика</h1>
            <p class="body-md">
              Сервис для планирования оптимальных маршрутов и распределения задач между курьерами, водителями и выездными сотрудниками
            </p>
            <div class="cta-group">
              <button class="button-primary" type="button">Получить консультацию</button>
              <button class="button-secondary" type="button">Попробовать демо</button>
            </div>
          </div>
          <div class="hero-visual">
            <img src="assets/illustrations/geopotok.png" alt="3D-визуал сервиса 2ГИС ГеоПоток для логистики">
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
